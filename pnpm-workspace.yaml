packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts by default; allow only the ones we rely on.
allowBuilds:
  esbuild: true
  workerd: true

# Security fixes that upstream packages haven't picked up yet. Remove each once it's no longer
# needed (check with `pnpm why <package>`).
overrides:
  # GHSA-xjj6-f33q-929c; miniflare (local Workers runtime) pins undici 7.28.0.
  undici@>=7.18.0 <7.30.1: 7.30.1
  # GHSA-mrhx-c7xc-m3w5, fixed in 4.6.6; @cloudflare/vitest-plugin pins zod 4.6.5.
  zod@>=4.0.0 <4.6.6: 4.6.7
  # GHSA-67mh-4wv8-2f99 (esbuild dev server); drizzle-kit's old loader pins esbuild 0.18.
  esbuild@<0.25.0: 0.25.12
  # GHSA-g3hv-75wg-m249 (minimatch denial of service), fixed in 11.0.1; eslint pins ^10.
  minimatch@>=7.0.0 <11.0.1: 11.0.4

name: Health check

# D-011: checks every 30 minutes that the public site answers and the dashboard is reachable
# (behind Cloudflare Access, so a sign-in redirect counts as up). A failed run emails the
# repository's notification settings. Skipped until HEALTH_SITE_URLS is set.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Space-separated public site addresses, e.g. "https://www.hantexultra.com/".
      HEALTH_SITE_URLS: ${{ vars.HEALTH_SITE_URLS }}
      HEALTH_DASHBOARD_URL: ${{ vars.HEALTH_DASHBOARD_URL }}
    steps:
      - name: Check
        run: |
          set -u
          if [ -z "$HEALTH_SITE_URLS" ]; then
            echo "::notice::Health checks are not configured yet (see docs/deployment.md); skipping."
            exit 0
          fi
          failed=0
          check() { # url, highest acceptable status
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 "$1")
            if [ "$status" -ge 200 ] && [ "$status" -le "$2" ]; then
              echo "ok   $status $1"
            else
              echo "::error::$1 answered $status"; failed=1
            fi
          }
          for url in $HEALTH_SITE_URLS; do check "$url" 299; done
          if [ -n "$HEALTH_DASHBOARD_URL" ]; then check "$HEALTH_DASHBOARD_URL" 399; fi
          exit $failed
